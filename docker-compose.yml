services:
  navimusic:
    build: .
    container_name: navimusic
    ports:
      # Expose only on localhost — your external Nginx reverse-proxies to here.
      - '127.0.0.1:4580:3000'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
